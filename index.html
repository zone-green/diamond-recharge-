<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diamond Recharge – Recargas de videojuegos</title>
<style>
:root{--bg:#05070f;--card:#0b1020;--text:#f4f6ff;--muted:#8a93b5;--line:#1c3470;--blue:#2f6bff;--cy:#4cc3ff;--gold:#fbbf24;--ok:#34d399;--bad:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:10px 14px 110px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gm{width:22px;height:22px;flex:none}
.ti{font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;font-weight:900;letter-spacing:-.01em}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(ellipse at 50% 110%,rgba(251,191,36,.4),transparent 55%),radial-gradient(circle at 85% 0%,rgba(76,195,255,.4),transparent 50%),radial-gradient(circle at 10% 25%,rgba(124,58,237,.3),transparent 45%),linear-gradient(180deg,#05070f,#0a1230 60%,#1a1020)}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,15,.3),rgba(5,7,15,.6))}
.bolt{position:absolute;top:0;width:28%;height:65%;opacity:0;filter:drop-shadow(0 0 8px #7fd0ff);animation:flash 7s infinite}
.bolt polyline{fill:none;stroke:#d6efff;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
@keyframes flash{0%,91%,100%{opacity:0}92%{opacity:.95}93%{opacity:.1}94%{opacity:1}97%{opacity:0}}
.bg i{position:absolute;bottom:-40px;font-style:normal;color:var(--gold);opacity:.4;text-shadow:0 0 10px var(--gold);animation:rise linear infinite;z-index:1}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
#splash{position:fixed;inset:0;z-index:80;display:grid;place-items:center;text-align:center;overflow:hidden}
#splash.out{visibility:hidden;pointer-events:none}
.pl{position:absolute;top:0;bottom:0;width:50.5%;background:#03050c;transition:transform 1s cubic-bezier(.77,0,.18,1)}
.pl.l{left:0}.pl.r{right:0}
#splash.open .pl.l{transform:translateX(-101%)}#splash.open .pl.r{transform:translateX(101%)}
.sc{position:relative;z-index:1;transition:transform 1s cubic-bezier(.6,0,.9,.4),opacity .8s}
#splash.open .sc{transform:scale(7);opacity:0}
.brand b{display:inline-block;opacity:0;transform:translateY(18px) scale(.6);animation:lt .45s forwards}
.brand .c{color:var(--cy)}
@keyframes lt{to{opacity:1;transform:none}}
.tg{animation:fade 1s 3.4s both}
.bigR{position:absolute;z-index:2;width:min(78vw,300px);aspect-ratio:1;display:grid;place-items:center;animation:rin .9s cubic-bezier(.2,1.4,.4,1) both;transition:transform .6s,opacity .5s}
.bigR .orn{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bigR .rs{animation:spin 14s linear infinite;transform-origin:100px 100px}
.bigR span{position:relative;font-size:min(46vw,170px);line-height:1;font-style:italic;background:linear-gradient(180deg,#fff7c2,#fbbf24 55%,#b45309);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(251,191,36,.9));animation:gp 1.4s ease-in-out infinite alternate}
.sp{animation:tw 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
#splash.go .bigR{transform:scale(.3);opacity:0}
@keyframes rin{from{transform:scale(.2) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{from{opacity:.2;transform:scale(.5)}to{opacity:1;transform:scale(1.2)}}
@keyframes gp{to{filter:drop-shadow(0 0 30px rgba(255,220,120,1))}}
.sg{width:96px;height:96px;animation:pop 1.2s ease-out both,glow 1.6s ease-in-out infinite alternate}
@keyframes pop{from{transform:scale(.2) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{to{filter:drop-shadow(0 0 24px var(--blue))}}
.brand{font-size:clamp(36px,12vw,60px);line-height:1.05;margin-top:10px;font-style:italic;letter-spacing:.06em}
.brand span,.lg span{color:var(--cy)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{width:180px;height:4px;border-radius:4px;background:var(--line);margin:20px auto 0;overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cy));animation:load 2.4s ease-out forwards}
@keyframes load{from{width:0}to{width:100%}}
.top{display:flex;align-items:center;justify-content:space-between;gap:6px;border:2px solid var(--line);border-radius:30px;padding:8px 8px 8px 14px;background:linear-gradient(180deg,#0b1430,#070b18);box-shadow:0 0 18px rgba(47,107,255,.25)}
.lg{display:flex;align-items:center;gap:7px;font-weight:900;font-size:17px;font-style:italic;line-height:1}
.lg .gm{width:30px;height:30px}
.rm{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-style:italic;color:#fcd34d;text-shadow:0 0 8px #f59e0b;background:radial-gradient(circle,#2a1a05,#0b0a12);border:2px solid #fbbf24;box-shadow:0 0 12px rgba(251,191,36,.6),inset 0 0 8px rgba(251,191,36,.3);position:relative;flex:none}
.rm::after{content:"✦";position:absolute;top:-7px;right:-5px;font-size:11px;font-style:normal;color:#fff;text-shadow:0 0 6px #fde68a}.lg small{display:block;font-size:10px;letter-spacing:.2em;color:var(--cy);font-style:normal;margin-top:3px}
.tr{display:flex;gap:6px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:#0a1330;border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px}
.ib{position:relative;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#0a1330;display:grid;place-items:center}
.ib em{position:absolute;top:-3px;right:-3px;background:var(--ok);color:#00170d;font-style:normal;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center}
.sbtn{border:2px solid var(--line);background:#0a1330;border-radius:12px;padding:8px 10px;font-weight:700;font-size:13px}
.sbtn.p{background:var(--blue);border-color:var(--blue)}
.ban{margin:14px 0 12px;border:2px solid var(--blue);border-radius:20px;padding:20px 18px;background:radial-gradient(circle at 88% 50%,#1d4ed8,transparent 60%),linear-gradient(135deg,#0b2a7a,#0a1330);min-height:140px;position:relative;overflow:hidden;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.ban h3{margin:0;font-size:34px;font-style:italic}.ban p{margin:2px 0 12px;color:#bcd0ff;font-size:14px}
.ban svg.dg{position:absolute;right:-6px;top:6px;width:150px;height:130px;filter:drop-shadow(0 0 14px #4cc3ff)}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;gap:6px;justify-content:center}
.dots b{width:8px;height:8px;border-radius:50%;background:#456}.dots b.on{background:#fff}
.btn{border:0;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--cy));padding:9px 16px;font-weight:800;color:#fff;display:inline-flex;gap:6px;align-items:center}
.sr{display:flex;align-items:center;gap:10px;border:2px solid var(--blue);border-radius:14px;padding:0 14px;background:#070b18;color:var(--muted)}
.sr input{flex:1;background:none;border:0;color:var(--text);font:inherit;padding:14px 0;outline:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tabs button{border:2px solid var(--line);background:#070b18;border-radius:14px;padding:13px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center}
.tabs button.on{background:linear-gradient(180deg,#3b7bff,#1f55d6);border-color:#5b8cff}
.hd{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;gap:8px}
.hd h2{margin:0;font-size:26px;border-left:4px solid var(--blue);padding-left:9px}
.hd h2 em{font-style:normal;background:#101a3d;color:var(--cy);font-size:14px;padding:3px 10px;border-radius:8px;margin-left:6px;font-family:system-ui}
.fl{display:flex;gap:8px;overflow-x:auto}.fl button{border:1px solid var(--line);background:#0a1330;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.fl button.on{background:var(--blue);border-color:var(--blue)}
.fl b{background:rgba(255,255,255,.12);border-radius:10px;padding:0 8px;font-size:13px}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer}
.art{height:148px;margin:6px;border-radius:16px;border:2px solid var(--blue);position:relative;overflow:hidden;box-shadow:inset 0 0 22px rgba(0,0,0,.5),0 0 14px rgba(47,107,255,.35)}
.art svg.ar{width:100%;height:100%;display:block}
.art img.ar,.th img{width:100%;height:100%;object-fit:cover;display:block}.art:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(180deg,transparent,rgba(2,5,14,.55));pointer-events:none}
.st{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);border:0;display:grid;place-items:center;color:#fff}
.st.on{color:var(--gold)}.st.on .i{fill:var(--gold)}
.gn{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 12px;font-weight:800;font-size:15px}
.pn{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:14px}
.pn h3{margin:0 0 10px;font-size:20px}
input.in{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:#070b18;color:var(--text);font:inherit;margin-bottom:10px;outline:none}
input.in:focus{border-color:var(--cy)}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{text-align:left;background:#070b18;border:2px solid var(--line);border-radius:14px;padding:12px;position:relative}
.opt.sel{border-color:var(--cy);box-shadow:0 0 0 3px rgba(76,195,255,.2)}
.opt b{display:block;font-size:20px}.opt small{color:var(--muted)}.opt .pr{display:block;color:var(--ok);font-weight:800;margin-top:2px}
.opt .gm{width:42px;height:36px;margin:0 0 5px;filter:drop-shadow(0 0 7px rgba(76,195,255,.75))}.opt{background:radial-gradient(circle at 18% 10%,rgba(47,107,255,.24),transparent 55%),linear-gradient(145deg,#101b3a,#070b18 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}.opt b{font-size:23px;letter-spacing:-.04em}.opt .pr{font-size:15px;color:#7db7ff}.opt.sel{background:linear-gradient(145deg,#173b86,#0a1530);border-color:#4cc3ff;box-shadow:0 0 0 2px rgba(76,195,255,.18),0 8px 22px rgba(47,107,255,.18)}
.off{background:var(--gold);color:#1a1200;font-style:normal;font-weight:800;font-size:11px;padding:2px 6px;border-radius:6px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #16224a;gap:8px}.row:last-child{border:0}
.mut{color:var(--muted);font-size:13px}
.big{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--blue),var(--cy));font-weight:800;font-size:16px;margin-top:10px;color:#fff}
.big.g{background:linear-gradient(90deg,#fde047,#f59e0b);color:#1a1200}.big:disabled{opacity:.4}
.back{background:none;border:0;color:var(--cy);font-weight:700;padding:12px 0 0;display:flex;align-items:center;gap:2px}
.pg{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}.pg h1{margin:0;font-size:38px}
.seg{display:flex;border:2px solid var(--line);border-radius:999px;padding:4px;background:#070b18}
.seg button{background:none;border:0;border-radius:999px;padding:9px 16px;font-weight:700;color:var(--muted)}.seg button.on{background:linear-gradient(180deg,#3b7bff,#1f55d6);color:#fff}
.hero{position:relative;min-height:150px;padding:18px 4px;overflow:hidden}
.hero h1{margin:14px 0 4px;font-size:46px}.hero p{margin:0;color:var(--muted);font-size:17px;max-width:55%}
.hero svg.dg{position:absolute;right:-10px;top:0;width:190px;height:150px;filter:drop-shadow(0 0 16px #4cc3ff)}
.bal{background:linear-gradient(160deg,#10193a,#070b18);border:1px solid var(--line);border-radius:28px;padding:18px}
.bal .t{display:flex;justify-content:space-between;align-items:center}
.tag{display:inline-flex;gap:6px;align-items:center;background:#0c2a33;border:1px solid #1d5a5f;color:#5eead4;border-radius:999px;padding:8px 14px;font-weight:800}
.bal .n{font-size:58px;margin:14px 0}.bal .n small{font-size:22px;color:var(--cy);margin-left:6px}
.sts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #1d2a55;border-radius:18px;background:rgba(255,255,255,.03)}
.sts div{padding:12px 8px;text-align:center;border-right:1px solid #1d2a55}.sts div:last-child{border:0}
.sts b{display:block;font-size:24px}.sts .p{color:var(--ok)}.sts span{font-size:12px;color:var(--muted)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.qa button{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 4px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.qa .ico{width:52px;height:52px;border-radius:16px;background:linear-gradient(180deg,#3b7bff,#1f55d6);display:grid;place-items:center}
.qa em{position:absolute;top:6px;right:10px;background:var(--bad);border-radius:10px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;font-style:normal}
.addr{word-break:break-all;background:#070b18;border:1px dashed var(--cy);border-radius:12px;padding:12px;margin:10px 0;font-family:ui-monospace,monospace;font-size:13px;user-select:all}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);background:linear-gradient(135deg,#10284d,#0a1330);border-radius:24px;padding:16px 4px;margin-bottom:12px}
.stat3 div{text-align:center;border-right:1px solid #1d3a6a;padding:0 4px}.stat3 div:last-child{border:0}
.stat3 .i{color:var(--cy);width:26px;height:26px}.stat3 b{display:block;font-size:38px;line-height:1.1}.stat3 span{color:var(--muted);font-size:14px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px 16px;margin-top:14px}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.gh b{font-size:20px;border-left:4px solid var(--blue);padding-left:8px}
.gh span{background:#14295c;color:#7fa8ff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.or{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #16224a}.or:last-child{border:0}
.th{width:58px;height:58px;border-radius:16px;overflow:hidden;flex:none;border:1px solid #2a4a9a}.th svg{width:100%;height:100%;display:block}
.oi{flex:1;min-width:0}.oi b{display:block;font-size:17px}.oi span{display:block}
.od{text-align:right}.od b{display:block;font-size:17px;margin-bottom:6px}

/* Carrito compacto estilo checkout */
.cart-list{display:grid;gap:10px;margin:14px 0 150px}
.cart-item{display:flex;gap:12px;align-items:center;padding:12px;background:linear-gradient(145deg,#111d3b,#080d1b);border:1px solid #25447f;border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.cart-item .th{width:62px;height:62px;border-radius:16px;background:#10295a}
.cart-item .oi b{font-size:16px}.cart-item .od b{color:#78b5ff}
.cart-checkout{position:fixed;z-index:30;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(100% - 24px,532px);padding:14px 16px;background:rgba(7,12,27,.97);backdrop-filter:blur(16px);border:1px solid #31549b;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.65),0 0 18px rgba(47,107,255,.16)}
.cart-checkout .row{padding:2px 0 8px;border:0}.cart-checkout .big{margin-top:4px}
.cart-empty{text-align:center;padding:28px 12px;color:var(--muted)}.cart-empty .gm{width:58px;height:58px;display:block;margin:0 auto 12px;filter:drop-shadow(0 0 10px #398bff)}

.chip{display:inline-flex;gap:4px;align-items:center;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;background:#0c3b2e;color:var(--ok);border:1px solid #14634a}
.chip .i{width:15px;height:15px}.chip.run{background:#3a2d0b;color:var(--gold);border-color:#6b5316}
.idc{background:linear-gradient(160deg,#121a36,#070b18);border:1px solid var(--line);border-radius:28px;padding:18px}
.idc .k{display:flex;justify-content:space-between;color:var(--cy);font-size:12px;letter-spacing:.2em;font-weight:800}
.idc .u{display:flex;gap:16px;align-items:center;margin:14px 0}
.av{width:84px;height:84px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-size:36px;background:radial-gradient(circle,#1d4ed8,#0a1330)}
.row2{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:14px;width:100%;text-align:left}
.row2 .ico{width:46px;height:46px;border-radius:14px;background:#10204a;display:grid;place-items:center;color:var(--cy)}
.row2 b{display:block;font-size:17px}.row2 .gr{margin-left:auto}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:30}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border:2px solid var(--line);border-radius:30px;padding:6px;background:rgba(7,11,24,.95);backdrop-filter:blur(8px)}
nav button{background:none;border:0;border-radius:24px;padding:9px 2px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{background:linear-gradient(180deg,#3b7bff,#1f55d6);color:#fff;font-weight:700}
#modal{position:fixed;inset:0;z-index:70;background:rgba(2,4,10,.8);display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.box{background:#0b1226;border:2px solid var(--line);border-radius:22px;padding:20px;width:100%;max-width:380px}
.mt{display:flex;gap:6px;margin-bottom:14px}.mt button{flex:1;padding:10px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:700}
.mt button.on{background:var(--blue);color:#fff}
#aerr{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px}
.x{float:right;background:none;border:0;color:var(--muted)}
#toast{position:fixed;left:14px;right:14px;bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;z-index:60;padding:13px 15px;border-radius:14px;background:#12301f;border:1px solid var(--ok);display:none}
#toast.err{background:#35151a;border-color:var(--bad)}
</style>
</head>

async function refreshAccount(){
 const {data:{user},error}=await sb.auth.getUser();
 if(error||!user){sbUser=null;me=null;return}
 sbUser=user;
 const [pr,wa,od,de]=await Promise.all([
  sb.from("profiles").select("*").eq("id",user.id).maybeSingle(),
  sb.from("wallets").select("balance").eq("user_id",user.id).maybeSingle(),
  sb.from("orders").select("*").eq("user_id",user.id).order("created_at",{ascending:false}),
  sb.from("deposits").select("*").eq("user_id",user.id).order("created_at",{ascending:false})
 ]);
 const local=load();
 me={id:user.id,name:pr.data?.username||user.user_metadata?.name||user.email.split("@")[0],email:user.email,
  bal:Number(wa.data?.balance||0),
  orders:(od.data||[]).map(o=>({g:o.game,q:o.package_name,id:"",usd:Number(o.amount),t:new Date(o.created_at).getTime(),st:o.status==="completed"?"done":"run"})),
  cart:local.cart||[],fav:local.fav||[],deps:de.data||[]};
}

$("nav").innerHTML="<div>"+it.map(x=>`<button class="${view===x[0]?"on":""}" data-a="nav" data-v="${x[0]}">${ic(x[1])}${x[2]}</button>`).join("")+"</div>"}
const BAN=[["BONO","en tu primer depósito"],["ENTREGA","rápida y segura"],["8 JUEGOS","disponibles para recargar"]];
function home(){const b=BAN[bn%3];
$("app").innerHTML=`<div class="ban">${dg()}<h3 class="ti">${b[0]}</h3><p>${b[1]}</p><button class="btn" data-a="nav" data-v="wallet">Depositar ${ic("chev")}</button><div class="dots">${BAN.map((_,i)=>`<b class="${i===bn%3?"on":""}"></b>`).join("")}</div></div>
<div class="sr">${ic("search")}<input id="q" placeholder="Buscar un juego…" value="${q}"></div>

<div class="hd"><h2 class="ti">Juegos <em id="cnt"></em></h2><div class="fl"><button data-a="tab" data-v="all" id="tAll">Todos</button><button data-a="tab" data-v="fav" id="tFav">Favoritos</button></div></div>
<div class="gg" id="gg"></div>`;
$("q").oninput=e=>{q=e.target.value;grid()};grid()}
function grid(){const fav=me?me.fav:[];
const l=G.filter(x=>x.n.toLowerCase().includes(q.toLowerCase())&&(tab==="all"||fav.includes(x.k)));
$("cnt").textContent=l.length;$("tAll").className=tab==="all"?"on":"";$("tFav").className=tab==="fav"?"on":"";
$("gg").innerHTML=l.map(x=>`<div class="gc" data-a="game" data-v="${x.k}"><div class="art">${art(x)}<button class="st ${fav.includes(x.k)?"on":""}" data-a="fav" data-v="${x.k}">${ic("star")}</button></div><div class="gn">${x.n}${ic("chev")}</div></div>`).join("")||`<div class="mut">No hay juegos aquí.</div>`}
function game(){const x=gk(g);
$("app").innerHTML=`<button class="back" data-a="nav" data-v="home">${ic("back")}Volver</button>
<div class="pn"><div style="display:flex;gap:14px;align-items:center;margin-bottom:14px"><div class="art" style="width:92px;height:92px;margin:0;flex:none">${art(x)}</div><h3 class="ti" style="font-size:28px;margin:0">${x.n}</h3></div>
<input class="in" id="uid" inputmode="numeric" placeholder="ID de jugador" autocomplete="off">
<div class="mut" style="margin-bottom:8px">Elige tu paquete de ${x.u}</div>
<div class="pk">${x.p.map((p,i)=>`<button class="opt" data-a="pk" data-v="${i}">${gem()}<b class="ti">${p[0].toLocaleString("es")}</b><small>${x.u}</small><span class="pr">${money(p[1])} créditos</span>${p[2]?`<em class="off">-${Math.round((1-p[1]/p[2])*100)}%</em>`:""}</button>`).join("")}</div>
<button class="big g" id="add" disabled data-a="add">Añadir al carrito</button><button class="big" id="now" disabled data-a="now">Comprar ahora</button></div>`;
$("uid").oninput=chk}
function chk(){const ok=$("uid").value.trim().length>=5&&pk!==null;$("add").disabled=$("now").disabled=!ok}
function item(){const x=gk(g),p=x.p[pk];return{k:x.k,g:x.n,id:$("uid").value.trim(),q:p[0],u:x.u,usd:p[1]}}
function cart(){const t=me.cart.reduce((s,c)=>s+c.usd,0);
$("app").innerHTML=`<div class="pg"><h1 class="ti">Mi carrito</h1><span class="chip">${me.cart.length} pedido${me.cart.length===1?"":"s"}</span></div>
${me.cart.length?`<div class="cart-list">${me.cart.map((c,i)=>`<div class="cart-item"><div class="th">${art(gk(c.k))}</div><div class="oi"><b>${c.q.toLocaleString("es")} ${c.u}</b><span class="mut">${c.g} · ID ${c.id}</span><b style="color:#78b5ff;margin-top:4px">${money(c.usd)} créditos</b></div><div class="od"><button class="sbtn" data-a="rm" data-v="${i}">Quitar</button></div></div>`).join("")}</div>
<div class="cart-checkout"><div class="row"><span class="mut">Total a pagar</span><b class="ti" style="font-size:24px;color:#78b5ff">${money(t)} créditos</b></div><div class="mut">Créditos disponibles: ${money(me.bal)} créditos</div><button class="big" data-a="pay">Pagar todos los pedidos</button></div>`:`<div class="pn cart-empty">${gem()}<b class="ti" style="display:block;color:#fff;font-size:20px">Tu carrito está vacío</b><span>Agrega uno o varios paquetes y aparecerán aquí.</span><button class="big" data-a="nav" data-v="home">Explorar juegos</button></div>`}` }
function monthSum(){const n=new Date();return me.orders.filter(o=>{const d=new Date(o.t);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()})}
function orders(){const all=me.orders,done=all.filter(o=>o.st==="done").length,run=all.length-done,mo=monthSum().length;
let list=otab==="buy"?all.filter(o=>ofil==="all"||(ofil==="done")===(o.st==="done")):[];
const grp={};list.forEach(o=>{const k=new Date(o.t).toLocaleDateString("es",{day:"numeric",month:"long"});(grp[k]=grp[k]||[]).push(o)});
$("app").innerHTML=`<div class="pg"><h1 class="ti">Mis órdenes</h1><div class="seg"><button data-a="ot" data-v="buy" class="${otab==="buy"?"on":""}">Compras</button><button data-a="ot" data-v="dep" class="${otab==="dep"?"on":""}">Depósitos</button></div></div>
<div class="stat3"><div>${ic("check")}<b class="ti">${done}</b><span>Entregadas</span></div><div>${ic("bolt")}<b class="ti">${run}</b><span>En curso</span></div><div>${ic("cal")}<b class="ti">${mo}</b><span>Este mes</span></div></div>
${otab==="buy"?`<div class="fl"><button class="${ofil==="all"?"on":""}" data-a="of" data-v="all">${ic("filter")}Todas <b>${all.length}</b></button><button class="${ofil==="done"?"on":""}" data-a="of" data-v="done">${ic("check")}Completadas <b>${done}</b></button><button class="${ofil==="run"?"on":""}" data-a="of" data-v="run">${ic("clock")}En curso <b>${run}</b></button></div>
${Object.entries(grp).map(([d,l])=>`<div class="grp"><div class="gh"><b class="ti">${d}</b><span>${l.length} órdenes</span></div>${l.map(o=>`<div class="or"><div class="th">${art(gk(o.k))}</div><div class="oi"><b class="ti">${o.q.toLocaleString("es")} ${o.u}</b><span class="mut">${o.g} · ID ${o.id}</span><span class="mut">${new Date(o.t).toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})}</span></div><div class="od"><b class="ti">${money(o.usd)} EDL</b><span class="chip ${o.st==="done"?"":"run"}">${ic(o.st==="done"?"check":"clock")}${o.st==="done"?"Completada":"En curso"}</span></div></div>`).join("")}</div>`).join("")||`<div class="grp mut">Aún no tienes pedidos.</div>`}`
:`<div class="grp">${(me.deps||[]).map(d=>`<div class="or"><div class="th" style="display:grid;place-items:center;background:#10204a">${gem("gm")}</div><div class="oi"><b class="ti">${money(d.a)} USDT</b><span class="mut">${d.h.slice(0,16)}…</span></div><span class="chip run">${ic("clock")}Pendiente</span></div>`).join("")||`<div class="mut">No has notificado depósitos.</div>`}</div>`}`}
function chart(){const bal=me.bal,days=[];for(let i=13;i>=0;i--){const end=new Date();end.setHours(23,59,59,999);end.setDate(end.getDate()-i);days.push(bal+me.orders.filter(o=>o.t>end.getTime()).reduce((s,o)=>s+o.usd,0))}
const mx=Math.max(...days),mn=Math.min(...days),r=mx-mn||1,pts=days.map((v,i)=>`${i*(300/13)},${70-((v-mn)/r)*56}`).join(" ");
return `<svg viewBox="0 0 300 80" style="width:100%;height:90px"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6bff" stop-opacity=".5"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></linearGradient></defs><polygon points="0,80 ${pts} 300,80" fill="url(#cg)"/><polyline points="${pts}" fill="none" stroke="#4cc3ff" stroke-width="2.5" stroke-linejoin="round"/></svg>`}
function wallet(){const sp=monthSum().reduce((s,o)=>s+o.usd,0),mv=me.orders.length+(me.deps||[]).length;
$("app").innerHTML=`<div class="hero">${dg()}<h1 class="ti">Mi Wallet</h1><p>Tu saldo y tus movimientos.</p></div>
<div class="bal"><div class="t"><span class="tag">${ic("wallet")}Créditos disponibles</span><span class="mut">1 crédito = 1 USD</span></div><div class="n ti">${money(me.bal)}<small>créditos</small></div>
<div class="sts"><div><b class="ti p">+0.00</b><span>Entró este mes</span></div><div><b class="ti">−${money(sp)}</b><span>Gastado este mes</span></div><div><b class="ti">${mv}</b><span>Movimientos</span></div></div></div>
<button class="big" data-a="sdep" style="display:flex;gap:10px;justify-content:center;align-items:center;margin-top:16px">${ic("plus")}Añadir créditos</button>
${sdep?`<div class="pn"><h3 class="ti">Añadir saldo</h3><div class="mut">Envía USDT únicamente por BNB Smart Chain (BEP20). 1 USDT equivale a 1 crédito EDL. Mínimo: 5 USDT. El saldo se acredita solo después de verificar la transacción en la blockchain.</div><div class="addr">${ADDR}</div><button class="big" data-a="copy">Copiar dirección</button><h3 class="ti" style="margin-top:18px">Ya envié mi depósito</h3><div class="mut" style="margin:12px 0 8px;color:#78b5ff">Recarga mínima: 5 créditos (5 USDT).</div><input class="in" id="damt" type="number" min="5" step="0.01" inputmode="decimal" placeholder="Monto enviado (mínimo 5 USDT)"><button class="big g" data-a="dep">Notificar depósito</button></div>`:""}
<div class="pn"><h3 class="ti">Tu saldo en los últimos 14 días</h3>${chart()}</div>
<div class="hd"><h2 class="ti" style="border:0;padding:0;font-size:22px">Últimos movimientos</h2><button class="sbtn" data-a="nav" data-v="orders" style="border:0;background:none;color:var(--cy)">Ver todos</button></div>
<div class="grp">${me.orders.slice(0,4).map(o=>`<div class="or"><div class="th">${art(gk(o.k))}</div><div class="oi"><b>${o.q.toLocaleString("es")} ${o.u}</b><span class="mut">${o.g}</span></div><b class="ti">−${money(o.usd)}</b></div>`).join("")||`<div class="mut">Sin movimientos todavía.</div>`}</div>`}
function profile(){const code="#"+btoa(mem.sess).replace(/[^A-Z0-9]/gi,"").slice(0,7).toUpperCase();
const rw=(i,t,s,a)=>`<button class="row2" data-a="${a}"><span class="ico">${ic(i)}</span><span><b class="ti">${t}</b><span class="mut">${s}</span></span><span class="gr">${ic("chev")}</span></button>`;
$("app").innerHTML=`<div class="hero" style="min-height:110px">${dg()}<h1 class="ti" style="font-size:40px">Mi perfil</h1><p>Tu cuenta, siempre contigo.</p></div>
<div class="idc"><div class="k"><span>● ID DE JUGADOR</span><span>${code}</span></div><div class="u"><div class="av ti">${me.name[0].toUpperCase()}</div><div><div class="ti" style="font-size:32px">${me.name}</div><div class="mut">${mem.sess}</div></div></div>
<div class="sts"><div><b class="ti">${me.orders.length}</b><span>Recargas</span></div><div><b class="ti">${money(me.bal)}</b><span>Saldo créditos</span></div><div><b class="ti">${me.fav.length}</b><span>Favoritos</span></div></div>
<div style="display:flex;gap:10px;margin-top:14px"><button class="big g" style="margin:0;display:flex;gap:8px;justify-content:center;align-items:center" data-a="soon2">${ic("trophy")}Mis logros</button><button class="sbtn" style="padding:0 18px" data-a="soon2">${ic("share")}</button></div></div>
<div class="qa" style="grid-template-columns:repeat(3,1fr)"><button data-a="favs"><span class="ico">${ic("star")}</span>Favoritos</button><button data-a="soon2"><span class="ico">${ic("users")}</span>Mi equipo</button><button data-a="bell"><span class="ico">${ic("bell")}</span>Avisos</button></div>
<div class="hd"><h2 class="ti">Mi cuenta</h2></div>${rw("user","Datos personales","Nombre y correo","soon2")}${rw("lock","Cerrar sesión","Salir de tu cuenta","logout")}`}
function lockView(){$("app").innerHTML=`<div class="pn" style="text-align:center"><h3 class="ti">Inicia sesión</h3><p class="mut">Crea tu cuenta para ver tus pedidos, saldo y carrito.</p><button class="big" data-a="open" data-v="reg">Crear cuenta</button></div>`}
function render(){drawTop();drawNav();
if(view==="home")home();else if(!me)lockView();else if(view==="game")game();else if(view==="cart")cart();else if(view==="orders")orders();else if(view==="wallet")wallet();else profile();scrollTo(0,0)}
function openM(m){mode=m;setM();$("aerr").textContent="";$("modal").classList.add("on")}
function setM(){const r=mode==="reg";$("tReg").classList.toggle("on",r);$("tLog").classList.toggle("on",!r);$("aname").style.display=r?"block":"none";$("ago").textContent=r?"Crear cuenta":"Entrar"}
async function go(){
 const n=$("aname").value.trim(),m=$("amail").value.trim().toLowerCase(),p=$("apass").value,er=$("aerr");
 if(!/^\\S+@\\S+\\.\\S+$/.test(m)){er.textContent="Correo no válido.";return}
 if(p.length<6){er.textContent="La contraseña debe tener al menos 6 caracteres.";return}
 if(mode==="reg"&&!n){er.textContent="Escribe tu nombre.";return}
 er.textContent="Conectando con Supabase…";
 const result=mode==="reg"
  ? await sb.auth.signUp({email:m,password:p,options:{data:{name:n}}})
  : await sb.auth.signInWithPassword({email:m,password:p});
 if(result.error){er.textContent=result.error.message;return}
 if(mode==="reg"&&!result.data.session){er.textContent="Cuenta creada. Confirma tu correo y luego inicia sesión.";return}
 await refreshAccount();$("modal").classList.remove("on");$("apass").value="";view="home";render();
}
function act(a,v){switch(a){
case"nav":view=v;render();break;
case"srch":view="home";render();$("q").focus();break;
case"open":openM(v);break;case"mreg":mode="reg";setM();break;case"mlog":mode="log";setM();break;
case"close":$("modal").classList.remove("on");break;case"go":go();break;
case"tab":tab=v;grid();break;
case"soon":toast("Gift Cards: próximamente.");break;case"soon2":toast("Próximamente.");break;case"bell":toast("No tienes notificaciones nuevas.");break;
case"favs":tab="fav";view="home";render();break;
case"game":if(!me){openM("reg");toast("Crea tu cuenta para ver los precios.");return}g=v;pk=null;view="game";render();break;
case"fav":{if(!me){openM("reg");return}const i=me.fav.indexOf(v);i<0?me.fav.push(v):me.fav.splice(i,1);save();grid();break}
case"pk":pk=+v;document.querySelectorAll(".opt").forEach((b,j)=>b.classList.toggle("sel",j===pk));chk();break;
case"add":me.cart.push(item());save();drawTop();toast("Añadido al carrito");break;
case"now":toast("La compra se habilitará al instalar la función segura de cobro EDL en Supabase.",true);break
case"rm":me.cart.splice(+v,1);save();render();break;
case"pay":toast("El pago del carrito requiere la función segura de cobro EDL en Supabase. Aún no se descontará saldo.",true);break
case"ot":otab=v;render();break;case"of":ofil=v;render();break;case"ot2":otab="dep";view="orders";render();break;
case"sdep":sdep=!sdep;render();break;
case"dep":{const a=parseFloat($("damt").value);if(!(a>=5)){toast("La recarga mínima es de 5 USDT.",true);return}
sb.from("deposits").insert({user_id:sbUser.id,amount:a,network:"BEP20",status:"pending"}).select().single().then(({error})=>{if(error){toast("No se pudo registrar: "+error.message,true);return}toast("Solicitud registrada. El pago debe verificarse antes de acreditar EDL.");sdep=false;refreshAccount().then(()=>{otab="dep";view="orders";render()})});break}
case"copy":{try{navigator.clipboard.writeText(ADDR).then(()=>toast("Dirección copiada"),()=>toast("Copia la dirección manualmente.",true))}catch(e){toast("Copia la dirección manualmente.",true)}break}
case"logout":sb.auth.signOut().then(()=>{sbUser=null;me=null;view="home";render()});break}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;e.stopPropagation();act(t.dataset.a,t.dataset.v)});
refreshAccount().then(()=>render()).catch(e=>{console.error(e);toast("No se pudo conectar con Supabase.",true);render()});
sb.auth.onAuthStateChange(()=>{refreshAccount().then(()=>render())});
render();setInterval(()=>{if(view==="home"&&document.activeElement.id!=="q"){bn++;const b=document.querySelector(".ban");if(b){const s=BAN[bn%3];b.querySelector("h3").textContent=s[0];b.querySelector("p").textContent=s[1];b.querySelectorAll(".dots b").forEach((d,i)=>d.classList.toggle("on",i===bn%3))}}},3500);
</script>
</body>
</html>
